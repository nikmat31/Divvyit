<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Divvy — send it to the group</title>
    <link rel="stylesheet" href="/.gallery-tmp/frame.css" />
  </head>
  <body>
    <div class="slide">
      <div class="mark"><img src="/icon.svg" alt="" /><span>Divvy</span></div>

      <div class="copy">
        <h1>Send it to <em>the group</em></h1>
        <p class="lede">A receipt with everyone's share, straight into the group chat.</p>
      </div>

      <div class="stage">
        <div class="chat">
          <div class="chat-day">Today</div>
          <div class="bubble me">
            <img
              src="/.gallery-tmp/receipt.png"
              alt="Bill split receipt: Nikhil ₹726, Priya ₹217, Arjun ₹328, total ₹1271"
            />
            <span class="tick">12:48 ✓✓</span>
          </div>
          <div class="bubble them"><span class="who">Priya</span>sending now 🙏</div>
          <div class="bubble them"><span class="who">Arjun</span>finally, no maths</div>
        </div>
      </div>

      <div class="url">divvyit.online</div>
    </div>
  </body>
</html>
